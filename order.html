<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Order - Burger3D</title>
    <link rel="stylesheet" href="order.css">
</head>
<body>

    <!-- Simple Back Navbar -->
    <nav class="order-nav">
        <div class="nav-logo" onclick="window.location.href='index.html'">Burger<span>3D</span></div>
        <a href="index.html" class="back-link">← Back to Home</a>
    </nav>

    <!-- Main Order Section -->
    <main class="order-container">
        
        <!-- Left Column: Checkout Form -->
        <section class="form-section">
            <h2>Delivery Details</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required placeholder="Minahil Attiq">
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="0000 000-0000">
                </div>

                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <input type="text" id="address" required placeholder="123 Street Name, City">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="burgerSelect">Choose what you want </label>
                        <select id="burgerSelect">
                            <option value="550" data-name="3D Classic Beef">3D Classic Beef — Rs 550</option>
                            <option value="600" data-name="Mega Crispy Chicken">Mega Crispy Chicken — Rs 600</option>
                            <option value="999" data-name="loaded Chicken Tenders">loaded Chicken Tenders — Rs 999</option>
                            <option value="550" data-name="Smoky BBQ Double"> Smoky BBQ Double — Rs 1,100</option>
                            <option value="550" data-name="Golden Rustic Fries">Golden Rustic Fries — Rs 500</option>
                            <option value="550" data-name="Chicken Brost">Chicken Brost — Rs 2,000</option>
                            <option value="550" data-name="Chicken Sandwich">Chicken Sandwich — Rs 800</option>
                            <option value="550" data-name="Red sauce Pasta">Red sauce Pasta — Rs1,000</option>
                            <option value="550" data-name="Paproni Pizza">Paproni Pizza — Rs 3,000</option>
                            <option value="550" data-name="Thin crust Pizza">Thin crust Pizza — Rs 1,500</option>
                            <option value="550" data-name="Patti Burger">Patti Burger — Rs 400</option>
                            <option value="550" data-name="Panko Onion Rings">Panko Onion Rings — Rs 500</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="quantity">Quantity</label>
                        <input type="number" id="quantity" min="1" value="1">
                    </div>
                </div>

                <button type="submit" class="submit-order-btn">Place Order</button>
            </form>
        </section>

        <!-- Right Column: Live Order Summary -->
        <section class="summary-section">
            <h2>Order Summary</h2>
            <div class="summary-card">
                <div class="summary-row">
                    <span id="summaryItemName">3D Classic Beef</span>
                    <span id="summaryItemPrice">Rs 550</span>
                </div>
                <div class="summary-row">
                    <span>Delivery Fee</span>
                    <span>Rs 150</span>
                </div>
                <hr>
                <div class="summary-row total-row">
                    <span>Total Amount</span>
                    <span id="summaryTotal">Rs 700 </span>
                </div>
            </div>
        </section>
    </main>

    <!-- Success Modal Window -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-box">
            <div class="success-icon">✓</div>
            <h3>Order Placed Successfully!</h3>
            <p>Your delicious multi-dimensional burger is being prepared and will arrive shortly.</p>
            <button class="modal-close-btn" onclick="window.location.href='index.html'">Return to Home</button>
        </div>
    </div>

    <script src="order.js"></script>
</body>
</html>
